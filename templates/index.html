<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <title>Gästbok</title>
  </head>

  <body>
    <h1>Min gästbok</h1>

    <form methods="POST" action="/write-json">
      <label>Skriv ett inlägg:</label>
      <br />

      <textarea name="inlagg" rows="5" cols="40"></textarea>

      <br /><br />

      <button type="submit">Skicka</button>
    </form>

    <h2>Inlägg</h2>

    {% for text in inlagg %}

    <p>{{ text }}</p>

    {% endfor %}
  </body>
</html>
